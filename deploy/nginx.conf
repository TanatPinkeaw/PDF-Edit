# Nginx config for the PDF Studio stack (HomeLab).
#
# Two things matter here beyond the usual static site settings:
#   * `mjs` must be served as JavaScript. The default mime.types shipped with
#     most Nginx packages has no `.mjs` entry, so module workers get rejected.
#     The app now bundles its worker as `.js`, but the override keeps any future
#     `.mjs` asset working.
#   * The CSP must allow `worker-src 'self' blob:` or pdf.js cannot start.

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  types {
    application/javascript mjs;
  }

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/pdf;

  # Shared between the site and the API in the compose network.
  upstream pdfstudio_api {
    server api:8787;
  }

  server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    # Hashed assets never change; index.html must always be revalidated.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    location = /index.html {
      add_header Cache-Control "no-store";
    }

    location /api/ {
      proxy_pass http://pdfstudio_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      client_max_body_size 60m;
    }

    # The app uses hash routes, so a fallback is only needed for stray paths.
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
